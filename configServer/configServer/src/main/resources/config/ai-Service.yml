server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/FitnessRecommendation
    username: root
    password: "NewPassword123!"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking
  dead-letter:
    exchange: fitness.dead-letter.exchange
    queue: activity.dead-letter.queue
    routing-key: activity.dead-letter

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}